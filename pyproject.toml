[project]
name = "scientific-research-assistant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Javad", email = "javadhossini@gmail.com" }
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "langchain>=1.5.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.8.0",
    "langchain-experimental>=0.4.2",
    "langchain-huggingface>=1.2.3",
    "langchain-openai>=1.7.4",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.20",
    "pymupdf>=2.1",
    "python-dotenv>=1.2.4",
    "qdrant-client>=1.20.0",
    "rich>=15.0.0",
    "sentence-transformers>=6.3.0",
    "tqdm>=4.70.1",
]

[project.scripts]
scientific-research-assistant = "scientific_research_assistant:main"

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
